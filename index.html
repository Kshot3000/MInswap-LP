<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minswap LP Fee Tracker</title>
<style>
body{font-family:system-ui,sans-serif;margin:2rem;background:#0f172a;color:#e2e8f0}
.card{background:#1e293b;padding:1rem;border-radius:12px;margin-bottom:1rem}
input,button{padding:0.5rem;margin:0.25rem}
button{background:#38bdf8;color:#0f172a;border:none;border-radius:6px;cursor:pointer}
pre{background:#0f172a;padding:1rem;border-radius:8px;overflow:auto}
</style>
</head>
<body>
<h1>Minswap LP Fee Tracker</h1>
<div class="card">
<label>Pool Address<br><input id="pool" size="60" placeholder="addr1..."></label><br>
<label>Your LP Balance<br><input id="balance" type="number" step="any"></label><br>
<label>Total LP Supply<br><input id="supply" type="number" step="any"></label><br>
<button onclick="calculate()">Calculate</button>
</div>
<div class="card">
<h2>Results</h2>
<pre id="output">Enter details and click Calculate.</pre>
</div>
<script>
function calculate(){
 const pool=document.getElementById('pool').value.trim();
 const bal=parseFloat(document.getElementById('balance').value);
 const sup=parseFloat(document.getElementById('supply').value);
 if(!pool||!bal||!sup){alert('Fill all fields');return}
 // Mock calculation - in production call backend API
 const share=bal/sup;
 const mockFees=0.0024; // mock total fees
 const rewards=mockFees*share;
 document.getElementById('output').textContent=
 `Pool: ${pool}
 LP Share: ${(share*100).toFixed(4)}%
 Estimated total fees: ${mockFees.toFixed(6)} ADA
 Your estimated rewards: ${rewards.toFixed(6)} ADA
 Note: This is demo data. Connect Blockfrost API for real data.`;
}
</script>
</body>
</html>
